<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM - Slang Package Manager</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2f3f;
            --text: #e6e8ee;
            --muted: #8b93a7;
            --accent: #4f8cff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        h1 { font-size: 3rem; letter-spacing: 2px; }
        h1 span { color: var(--accent); }
        p { color: var(--muted); }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 32px;
            width: min(520px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; }
        .card .row b { color: var(--text); font-weight: 600; }
        code {
            background: #232838;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Slang <span>SPM</span></h1>
    <p>Slang 包管理器服务器</p>
    <div class="card">
        <div class="row"><span>服务状态</span><b>运行中</b></div>
        <div class="row"><span>模块仓库</span><b><code>GET /api/list/module</code></b></div>
        <div class="row"><span>VM 仓库</span><b><code>GET /api/list/vm</code></b></div>
        <div class="row"><span>发布模块</span><b><code>POST /api/publish/module</code></b></div>
        <div class="row"><span>发布 VM</span><b><code>POST /api/publish/vm</code></b></div>
    </div>
</body>
</html>
